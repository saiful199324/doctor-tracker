# Render Blueprint for the Express API (server/). The Next.js client is deployed to Vercel.
services:
  - type: web
    name: doctor-tracker-api
    runtime: node
    plan: free
    region: singapore
    rootDir: server
    # --include=dev: TypeScript is a devDependency, and NODE_ENV=production would otherwise skip it
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20"
      - key: TRUST_PROXY
        value: "2" # Vercel rewrite + Render load balancer
      - key: JWT_EXPIRES_IN
        value: 1d
      # Set in the dashboard (or by the deploy script); never committed:
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CLIENT_ORIGIN
        sync: false
