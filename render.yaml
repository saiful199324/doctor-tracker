# Render Blueprint: one free web service runs both apps side by side.
#   - Next.js client listens on Render's public $PORT
#   - Express API listens on internal port 4000 (not publicly reachable);
#     Next.js proxies /api/* to it, exactly like the local setup
# One service instead of two keeps the demo inside the free plan's monthly hours.
services:
  - type: web
    name: doctor-tracker
    runtime: node
    plan: free
    region: singapore
    # --include=dev: TypeScript and the build tools are devDependencies, and NODE_ENV=production would skip them
    buildCommand: >-
      npm ci --include=dev &&
      npm --prefix server ci --include=dev &&
      npm --prefix client ci --include=dev &&
      npm run build
    startCommand: npm run start:render
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20"
      - key: API_URL
        value: http://127.0.0.1:4000
      - key: TRUST_PROXY
        value: loopback, linklocal, uniquelocal # skip Render's private-network hops
      - key: CLIENT_IP_HEADER
        value: cf-connecting-ip # Render is fronted by Cloudflare, which always sets this
      - key: JWT_EXPIRES_IN
        value: 1d
      # Set in the dashboard (or by the deploy script); never committed:
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
