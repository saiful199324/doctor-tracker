# Render's free plan sleeps after 15 idle minutes, and waking takes up to a minute.
# Pinging the health endpoint every 10 minutes keeps the demo responsive.
# Set the repository variable API_HEALTH_URL (Settings → Secrets and variables → Actions → Variables).
name: Keep API warm

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    if: ${{ vars.API_HEALTH_URL != '' }}
    steps:
      - name: Ping API health check
        run: curl --fail --silent --show-error --max-time 90 --retry 2 "${{ vars.API_HEALTH_URL }}"
